<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Complete your Winicious order — delivery details and payment.">
    <title>Checkout | Winicious</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/checkout.css">
</head>
<body class="nav__dark">

<div id="navbar-placeholder"></div>

<main>

    <!-- HEADER -->
    <section class="checkout-header section">
        <div class="container">
            <div class="section-heading">
                <p class="eyebrow">Your order</p>
                <h1>Checkout.</h1>
                <p>
                    Complete your details below to place your order.
                </p>
            </div>
        </div>
    </section>

    <!-- CHECKOUT -->
    <section class="checkout section">
        <div class="container">
            <div class="checkout-layout">

                <!-- FORM -->
                <div class="checkout-form-wrapper">
                    <div class="checkout-card">
                        <div class="checkout-card__heading">
                            <p class="eyebrow">Delivery details</p>
                            <h2>Your Information</h2>
                        </div>

                        <form id="checkoutForm">
                            <div class="form-group">
                                <label for="customerName">Full name</label>
                                <input
                                    type="text"
                                    id="customerName"
                                    name="customerName"
                                    placeholder="Enter your full name"
                                    autocomplete="name"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="customerEmail">Email address</label>
                                <input
                                    type="email"
                                    id="customerEmail"
                                    name="customerEmail"
                                    placeholder="you@example.com"
                                    autocomplete="email"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="customerPhone">Phone number</label>
                                <input
                                    type="tel"
                                    id="customerPhone"
                                    name="customerPhone"
                                    placeholder="08012345678"
                                    autocomplete="tel"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="deliveryAddress">Delivery address</label>
                                <textarea
                                    id="deliveryAddress"
                                    name="deliveryAddress"
                                    rows="4"
                                    placeholder="Street, area, city"
                                    autocomplete="street-address"
                                    required
                                ></textarea>
                            </div>

                            <div class="form-group">
                                <label>Payment method</label>
                                <div class="payment-options">
                                    <label class="payment-option">
                                        <input
                                            type="radio"
                                            name="paymentMethod"
                                            value="flutterwave"
                                            checked
                                        >
                                        <span>
                                            <strong>Flutterwave</strong>
                                            <small>Pay securely online</small>
                                        </span>
                                    </label>

                                    <label class="payment-option">
                                        <input
                                            type="radio"
                                            name="paymentMethod"
                                            value="bank_transfer"
                                        >
                                        <span>
                                            <strong>Bank transfer</strong>
                                            <small>Pay by bank transfer</small>
                                        </span>
                                    </label>
                                </div>
                            </div>

                            <div
                                class="checkout-message checkout-message--error"
                                id="checkoutError"
                                hidden
                            ></div>

                            <div
                                class="checkout-message checkout-message--success"
                                id="checkoutSuccess"
                                hidden
                            ></div>

                            <button
                                type="submit"
                                class="btn btn--primary checkout-submit"
                                id="placeOrderButton"
                            >
                                Place order
                                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- SUMMARY -->
                <aside class="checkout-summary">
                    <div class="checkout-card">
                        <div class="checkout-card__heading">
                            <p class="eyebrow">Your bag</p>
                            <h2>Order Summary</h2>
                        </div>

                        <div class="checkout-items" id="checkoutItems"></div>

                        <div class="checkout-empty" id="checkoutEmpty" hidden>
                            <p>Your bag is empty.</p>
                            <a href="shop.html" class="text-link">Return to shop</a>
                        </div>

                        <div class="checkout-totals" id="checkoutTotals">
                            <div class="checkout-total-row">
                                <span>Subtotal</span>
                                <strong id="checkoutSubtotal">₦0</strong>
                            </div>

                            <div class="checkout-total-row">
                                <span>Delivery</span>
                                <strong id="checkoutDelivery">₦0</strong>
                            </div>

                            <div class="checkout-total-row checkout-total-row--grand">
                                <span>Total</span>
                                <strong id="checkoutTotal">₦0</strong>
                            </div>
                        </div>
                    </div>
                </aside>

            </div>
        </div>
    </section>

</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="javascript/supabase.js"></script>
<script src="javascript/script.js"></script>
<script src="javascript/checkout.js"></script>

</body>
</html>
