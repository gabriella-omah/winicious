<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Orders | Winicious Admin</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="admin-orders.css">
    <link rel="stylesheet" href="admin-orders.css">
</head>
<body>

<main class="admin-page orders-page">

    <header class="orders-header">
        <div>
            <p class="eyebrow">Shop</p>
            <h1>Orders</h1>
            <p class="orders-header__text">
                Manage customer shop orders and fulfilment.
            </p>
        </div>

        <div class="orders-header__actions">
            <a href="admin.html" class="admin-nav-link">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                Dashboard
            </a>
        </div>
    </header>

    <div id="ordersContent" class="orders-content">
        <div class="loading-orders">
            Loading orders...
        </div>
    </div>

</main>

<!-- Order details modal -->
<div
    class="order-modal"
    id="orderModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="orderModalTitle"
    hidden
>
    <div class="order-modal__backdrop" id="orderModalBackdrop"></div>

    <div class="order-modal-content">
        <div class="order-modal-header">
            <h2 id="orderModalTitle">Order Details</h2>
            <button
                type="button"
                class="close-modal"
                id="closeOrderModal"
                aria-label="Close"
            >
                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
        </div>

        <div id="orderDetails">
            <!-- Filled by JavaScript -->
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../javascript/supabase.js"></script>
<script src="admin-orders.js"></script>

</body>
</html>
