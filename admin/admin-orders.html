<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders | Winicious Admin</title>

    <link rel="stylesheet" href="style/style.css">

    <style>
        .orders-page {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .orders-header h1 {
            margin: 0;
        }

        .orders-table-wrapper {
            overflow-x: auto;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        .orders-table th,
        .orders-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .orders-table th {
            font-weight: 600;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            text-transform: capitalize;
        }

        .status--pending {
            background: #fff3cd;
        }

        .status--processing {
            background: #cfe2ff;
        }

        .status--shipped {
            background: #e2d9f3;
        }

        .status--delivered {
            background: #d1e7dd;
        }

        .status--cancelled {
            background: #f8d7da;
        }

        .payment-paid {
            color: #198754;
            font-weight: 600;
        }

        .payment-pending {
            color: #997404;
            font-weight: 600;
        }

        .payment-failed {
            color: #dc3545;
            font-weight: 600;
        }

        .order-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .order-actions button {
            cursor: pointer;
        }

        .empty-orders {
            text-align: center;
            padding: 50px 20px;
        }

        .loading-orders {
            text-align: center;
            padding: 50px 20px;
        }

        .order-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .order-modal.is-open {
            display: flex;
        }

        .order-modal-content {
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
        }

        .order-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .close-modal {
            border: none;
            background: none;
            font-size: 28px;
            cursor: pointer;
        }

        .order-section {
            margin-bottom: 25px;
        }

        .order-section h3 {
            margin-bottom: 12px;
        }

        .order-items {
            border-top: 1px solid #eee;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <main class="orders-page">

        <div class="orders-header">
            <div>
                <h1>Orders</h1>
                <p>Manage customer shop orders.</p>
            </div>

            <a href="admin.html" class="btn btn--primary">
                Back To Dashboard
            </a>
        </div>

        <div id="ordersContent">
            <div class="loading-orders">
                Loading orders...
            </div>
        </div>

    </main>

    <!-- Order Details Modal -->
    <div class="order-modal" id="orderModal">

        <div class="order-modal-content">

            <div class="order-modal-header">
                <h2>Order Details</h2>

                <button
                    type="button"
                    class="close-modal"
                    id="closeOrderModal"
                    aria-label="Close"
                >
                    &times;
                </button>
            </div>

            <div id="orderDetails">
                <!-- Details inserted by JavaScript -->
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../javascript/supabase.js"></script>
    <script src="admin-orders.js"></script>

</body>
</html>
